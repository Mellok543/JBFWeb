spring:
  datasource:
    url: jdbc:h2:file:./data/jbforsaken-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: "local-development-secret-key-at-least-32-bytes-long!!"

app:
  frontend-origin: "http://localhost:5173"

steam-openid:
  realm-url: "http://127.0.0.1:5080"
  return-url: "http://127.0.0.1:5080/api/auth/steam/callback"

logging:
  level:
    com.jbforsaken.web: DEBUG
